<!-- Define o documento como HTML5 -->
<!DOCTYPE html>

<!-- Define o idioma principal da página como português do Brasil -->
<html lang="pt-BR">

<head>
    <!-- Configura a codificação de caracteres para exibir acentos corretamente -->
    <meta charset="UTF-8">

    <!-- Permite adaptar o layout à largura de celulares, tablets e computadores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título exibido na aba do navegador -->
    <title>Serviços - Clínica Veterinária</title>

    <!-- Importa o Bootstrap 5.3.3 para utilizar estilos e componentes prontos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Importa a folha de estilos própria do projeto -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Barra de navegação principal do site -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <!-- Nome da clínica; o link direciona para a página inicial -->
            <a class="navbar-brand" href="index.html">
                Clínica Veterinária
            </a>

            <!-- Botão que permite abrir ou fechar o menu em telas menores -->
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">

                <!-- Ícone visual do botão do menu responsivo -->
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Área expansível que contém os links de navegação -->
            <div class="collapse navbar-collapse" id="menu">

                <!-- Lista de links alinhada à direita em telas maiores -->
                <ul class="navbar-nav ms-auto">

                    <!-- Link para a página inicial -->
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>

                    <!-- Link para a página que apresenta os serviços -->
                    <li class="nav-item">
                        <a class="nav-link" href="servicos.html">Serviços</a>
                    </li>

                    <!-- Link para a página de contato e agendamento -->
                    <li class="nav-item">
                        <a class="nav-link" href="contato.html">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal da página -->
    <!-- container centraliza o conteúdo e my-5 adiciona espaçamento vertical -->
    <main class="container my-5">

        <!-- Seção de apresentação do catálogo de serviços -->
        <!-- text-center centraliza o texto -->
        <section class="text-center">

            <!-- Título principal da página -->
            <h1>Nossos serviços</h1>

            <!-- Texto introdutório do catálogo -->
            <p>Conheça os cuidados disponíveis para seu animal.</p>
        </section>

        <!-- Seção que organiza os cards dos serviços em uma grade -->
        <!-- row cria uma linha e g-4 define o espaçamento entre as colunas -->
        <section class="row g-4 my-4">

            <!-- Coluna que ocupa um terço da linha em telas médias ou maiores -->
            <div class="col-md-4">

                <!-- Card que reúne imagem, descrição e botão do serviço -->
                <!-- h-100 mantém o card com altura total disponível na coluna -->
                <div class="card h-100">

                    <!-- Imagem ilustrativa do serviço de consulta veterinária -->
                    <!-- src indica o caminho do arquivo de imagem -->
                    <!-- alt fornece uma descrição alternativa para acessibilidade -->
                    <img src="imagens/consulta.svg"
                        class="card-img-top" alt="Consulta veterinária">

                    <!-- Área interna do card que contém as informações -->
                    <div class="card-body">

                        <!-- Nome do serviço apresentado no card -->
                        <h2 class="card-title">Consulta</h2>

                        <!-- Descrição breve do atendimento oferecido -->
                        <p class="card-text">
                            Atendimento e avaliação veterinária.
                        </p>

                        <!-- Link para a página de contato, onde está o formulário -->
                        <!-- As classes btn e btn-primary aplicam o estilo de botão do Bootstrap -->
                        <a href="contato.html" class="btn btn-primary">
                            Agendar
                        </a>
                    </div>
                </div>
            </div>

            <!-- Os demais serviços podem ser adicionados seguindo a mesma estrutura:
                 coluna, card, imagem, título, descrição e link para agendamento. -->
        </section>
    </main>

    <!-- Rodapé da página -->
    <footer class="text-center py-4">

        <!-- Identificação da clínica e do projeto acadêmico -->
        <!-- mb-0 remove a margem inferior do parágrafo -->
        <p class="mb-0">Clínica Veterinária - Projeto TDS I</p>
    </footer>

    <!-- Importa o JavaScript do Bootstrap -->
    <!-- A versão bundle inclui os recursos necessários para o menu responsivo -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
```
