<!-- Define o padrão HTML5 -->
<!DOCTYPE html>

<!-- Define o idioma -->
<html lang="pt-BR">

<head>
    <!-- Configura a codificação dos caracteres -->
    <meta charset="UTF-8">

    <!-- Adapta o conteúdo à largura da tela -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título da página -->
    <title>Serviços - Clínica Veterinária</title>

    <!-- Importa o Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Importa os estilos próprios -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Menu de navegação -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                Clínica Veterinária
            </a>

            <!-- Botão do menu para telas menores -->
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Links de navegação -->
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="servicos.html">Serviços</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contato.html">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container my-5">
        <!-- Apresentação do catálogo -->
        <section class="text-center">
            <h1>Nossos serviços</h1>
            <p>Conheça os cuidados disponíveis para seu animal.</p>
        </section>

        <!-- Cada card representa um serviço -->
        <section class="row g-4 my-4">
            <div class="col-md-4">
                <div class="card h-100">
                    <!-- Imagem ilustrativa do serviço -->
                    <img src="imagens/consulta.svg"
                        class="card-img-top" alt="Consulta veterinária">

                    <div class="card-body">
                        <h2 class="card-title">Consulta</h2>
                        <p class="card-text">
                            Atendimento e avaliação veterinária.
                        </p>

                        <!-- Abre a página de agendamento -->
                        <a href="contato.html" class="btn btn-primary">
                            Agendar
                        </a>
                    </div>
                </div>
            </div>

            <!-- Os demais serviços seguem a mesma organização -->
        </section>
    </main>

    <!-- Rodapé -->
    <footer class="text-center py-4">
        <p class="mb-0">Clínica Veterinária - Projeto TDS I</p>
    </footer>

    <!-- Importa o JavaScript do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
