<!-- Define o documento como HTML5 -->
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Configura a codificação de caracteres -->
    <meta charset="UTF-8">

    <!-- Permite a adaptação a celulares e computadores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título da página -->
    <title>Contato - Clínica Veterinária</title>

    <!-- Importa o Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Importa o CSS do projeto -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Menu de navegação -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                Clínica Veterinária
            </a>

            <!-- Botão do menu responsivo -->
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Links entre as páginas -->
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="servicos.html">Serviços</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contato.html">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal do formulário -->
    <main class="container my-5">
        <section class="text-center">
            <h1>Agendamento e contato</h1>
            <p>Preencha os dados para preparar sua solicitação.</p>
        </section>

        <!-- O formulário reúne os dados necessários para o agendamento -->
        <form id="formAgendamento">
            <!-- Campo para identificar o responsável -->
            <label for="nome">Nome do responsável</label>
            <input class="form-control" id="nome"
                name="nome" type="text" required>

            <!-- Campo para o e-mail -->
            <label for="email">E-mail</label>
            <input class="form-control" id="email"
                name="email" type="email" required>

            <!-- Campo para o nome do animal -->
            <label for="animal">Nome do animal</label>
            <input class="form-control" id="animal"
                name="animal" type="text" required>

            <!-- Seletor de serviços: data-price armazena o preço -->
            <label for="servico">Serviço</label>
            <select class="form-select" id="servico"
                name="servico" required>
                <option value="">Selecione um serviço</option>
                <option value="consulta" data-price="80">
                    Consulta
                </option>
            </select>

            <!-- Os adicionais usam a classe adicional e seu preço -->
            <label>
                <input type="checkbox" class="adicional"
                    value="Banho" data-price="40">
                Banho
            </label>

            <!-- Área que apresenta os valores calculados -->
            <p>Serviço: <span id="servicoSelecionado"></span></p>
            <p>Adicionais: <span id="totalAdicionais"></span></p>
            <p>Total: <span id="totalGeral"></span></p>

            <!-- Envia o formulário para a validação em JavaScript -->
            <button type="submit" class="btn btn-primary">
                Preparar solicitação
            </button>
        </form>
    </main>

    <!-- Rodapé -->
    <footer class="text-center py-4">
        <p class="mb-0">Clínica Veterinária - Projeto TDS I</p>
    </footer>

    <!-- Biblioteca do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Código que calcula os valores e valida o formulário -->
    <script src="script.js"></script>
</body>

</html>
