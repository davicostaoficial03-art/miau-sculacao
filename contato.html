<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - Clínica Veterinária</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Barra de navegação -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                Clínica Veterinária
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="servicos.html">Serviços</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contato.html">Contato</a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <main>

        <!-- Introdução -->
        <section class="container text-center my-5">

            <h1>Agende um atendimento</h1>

            <p>
                Preencha o formulário abaixo para solicitar
                um atendimento para seu animal.
            </p>

        </section>

        <!-- Formulário -->
        <section class="container my-5">

            <form>

                <!-- Dados do responsável -->
                <div class="row">

                    <div class="col-12 col-md-6">

                        <div class="mb-3">

                            <label for="nome" class="form-label">
                                Nome do responsável
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nome"
                                name="nome_responsavel"
                                required>

                        </div>

                    </div>

                    <div class="col-12 col-md-6">

                        <div class="mb-3">

                            <label for="email" class="form-label">
                                E-mail
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                required>

                        </div>

                    </div>

                </div>

                <!-- Dados do animal -->
                <div class="row">

                    <div class="col-12 col-md-6">

                        <div class="mb-3">

                            <label for="animal" class="form-label">
                                Nome do animal
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="animal"
                                name="nome_animal"
                                required>

                        </div>

                    </div>

                    <div class="col-12 col-md-6">

                        <div class="mb-3">

                            <label for="especie" class="form-label">
                                Espécie
                            </label>

                            <select
                                class="form-select"
                                id="especie"
                                name="especie_animal"
                                required>

                                <option value="">
                                    Selecione
                                </option>

                                <option value="cachorro">
                                    Cachorro
                                </option>

                                <option value="gato">
                                    Gato
                                </option>

                                <option value="outro">
                                    Outro
                                </option>

                            </select>

                        </div>

                    </div>

                </div>

                <!-- Tipo de atendimento -->
                <div class="mb-3">

                    <label for="servico" class="form-label">
                        Serviço desejado
                    </label>

                    <select
                        class="form-select"
                        id="servico"
                        name="servico"
                        required>

                        <option value="">
                            Selecione um serviço
                        </option>

                        <option value="consulta">
                            Consulta veterinária
                        </option>

                        <option value="vacinacao">
                            Vacinação
                        </option>

                        <option value="banho">
                            Banho e higiene
                        </option>

                        <option value="avaliacao">
                            Avaliação preventiva
                        </option>

                        <option value="orientacao">
                            Orientação
                        </option>

                        <option value="acompanhamento">
                            Acompanhamento
                        </option>

                    </select>

                </div>

                <!-- Sexo do animal -->
                <fieldset class="mb-3">

                    <legend>
                        Sexo do animal
                    </legend>

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="sexo_animal"
                            id="macho"
                            value="macho">

                        <label class="form-check-label" for="macho">
                            Macho
                        </label>

                    </div>

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="radio"
                            name="sexo_animal"
                            id="femea"
                            value="femea">

                        <label class="form-check-label" for="femea">
                            Fêmea
                        </label>

                    </div>

                </fieldset>

                <!-- Serviços adicionais -->
                <fieldset class="mb-3">

                    <legend>
                        Serviços adicionais
                    </legend>

                    <div class="form-check">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            name="servico_adicional"
                            id="retorno"
                            value="retorno">

                        <label class="form-check-label" for="retorno">
                            Gostaria de receber informações sobre retorno
                        </label>

                    </div>

                </fieldset>

                <!-- Observações -->
                <div class="mb-3">

                    <label for="mensagem" class="form-label">
                        Observações
                    </label>

                    <textarea
                        class="form-control"
                        id="mensagem"
                        name="observacoes"
                        rows="5"
                        placeholder="Digite alguma informação importante sobre o animal...">
                    </textarea>

                </div>

                <!-- Botão -->
                <button type="submit" class="btn btn-primary">
                    Enviar solicitação
                </button>

            </form>

        </section>

    </main>

    <!-- Rodapé -->
    <footer class="text-center py-4">

        <p class="mb-0">
            Clínica Veterinária - Projeto TDS I
        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
```
