<!-- Define o documento como HTML5 -->
<!DOCTYPE html>

<!-- Define o idioma principal da página como português do Brasil -->
<html lang="pt-BR">

<head>
    <!-- Configura a codificação de caracteres para exibir acentos e símbolos corretamente -->
    <meta charset="UTF-8">

    <!-- Permite que a página se adapte à largura da tela de celulares, tablets e computadores -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título exibido na aba do navegador -->
    <title>Contato - Clínica Veterinária</title>

    <!-- Importa o Bootstrap 5.3.3, utilizado na estilização e nos componentes da página -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Importa a folha de estilos própria do projeto -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Barra de navegação principal do site -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <!-- Nome da clínica; ao clicar, o usuário retorna à página inicial -->
            <a class="navbar-brand" href="index.html">
                Clínica Veterinária
            </a>

            <!-- Botão que abre ou fecha o menu em telas menores -->
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">

                <!-- Ícone visual do botão de navegação responsiva -->
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Área expansível que contém os links de navegação -->
            <div class="collapse navbar-collapse" id="menu">
                <!-- Lista de links alinhada à direita em telas maiores -->
                <ul class="navbar-nav ms-auto">

                    <!-- Link para a página inicial -->
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Início</a>
                    </li>

                    <!-- Link para a página de serviços -->
                    <li class="nav-item">
                        <a class="nav-link" href="servicos.html">Serviços</a>
                    </li>

                    <!-- Link para a página atual de contato -->
                    <li class="nav-item">
                        <a class="nav-link" href="contato.html">Contato</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal da página, com espaçamento vertical -->
    <main class="container my-5">

        <!-- Cabeçalho centralizado que apresenta a finalidade da página -->
        <section class="text-center">
            <!-- Título principal da página -->
            <h1>Agendamento e contato</h1>

            <!-- Instrução inicial para o preenchimento do formulário -->
            <p>Preencha os dados para preparar sua solicitação.</p>
        </section>

        <!-- Formulário que coleta os dados do responsável, do animal e do serviço -->
        <form id="formAgendamento">

            <!-- Campo de texto para informar o nome do responsável pelo animal -->
            <!-- O atributo for associa o rótulo ao campo cujo id é "nome" -->
            <label for="nome">Nome do responsável</label>
            <input class="form-control" id="nome"
                name="nome" type="text" required>

            <!-- Campo para informar o e-mail do responsável -->
            <!-- type="email" permite ao navegador verificar o formato básico do endereço -->
            <!-- required impede o envio quando o campo está vazio -->
            <label for="email">E-mail</label>
            <input class="form-control" id="email"
                name="email" type="email" required>

            <!-- Campo de texto para informar o nome do animal atendido -->
            <label for="animal">Nome do animal</label>
            <input class="form-control" id="animal"
                name="animal" type="text" required>

            <!-- Lista de serviços disponíveis para seleção -->
            <label for="servico">Serviço</label>
            <select class="form-select" id="servico"
                name="servico" required>

                <!-- Opção inicial sem serviço selecionado -->
                <option value="">Selecione um serviço</option>

                <!-- Serviço de consulta veterinária -->
                <!-- value identifica o serviço no código JavaScript -->
                <!-- data-price armazena o preço numérico utilizado no cálculo -->
                <option value="consulta" data-price="80">
                    Consulta
                </option>
            </select>

            <!-- Opções adicionais que podem ser incluídas no pedido -->
            <!-- A classe "adicional" permite localizar este campo com JavaScript -->
            <!-- data-price guarda o preço do adicional -->
            <label>
                <input type="checkbox" class="adicional"
                    value="Banho" data-price="40">

                <!-- Nome do serviço adicional -->
                Banho
            </label>

            <!-- Área de resumo dos valores calculados pelo JavaScript -->

            <!-- Exibe o nome e o preço do serviço principal selecionado -->
            <p>Serviço: <span id="servicoSelecionado"></span></p>

            <!-- Exibe os adicionais selecionados e seus respectivos valores -->
            <p>Adicionais: <span id="totalAdicionais"></span></p>

            <!-- Exibe a soma do serviço principal com os adicionais -->
            <p>Total: <span id="totalGeral"></span></p>

            <!-- Botão que solicita a preparação do formulário -->
            <!-- O tipo submit aciona o evento de envio do formulário -->
            <!-- O JavaScript pode interceptar esse evento para validar os dados -->
            <button type="submit" class="btn btn-primary">
                Preparar solicitação
            </button>
        </form>
    </main>

    <!-- Rodapé da página com identificação do projeto -->
    <footer class="text-center py-4">
        <!-- mb-0 remove a margem inferior do parágrafo -->
        <p class="mb-0">Clínica Veterinária - Projeto TDS I</p>
    </footer>

    <!-- Importa o JavaScript do Bootstrap para habilitar componentes interativos -->
    <!-- A versão bundle inclui os recursos necessários para o menu responsivo -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Importa o JavaScript próprio do projeto -->
    <!-- Este arquivo é responsável pelos cálculos dos preços e pela validação do formulário -->
    <script src="script.js"></script>
</body>

</html>
```
